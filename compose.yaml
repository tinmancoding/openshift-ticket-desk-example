# Local development only. OpenShift resources are rendered by scripts/desk.py.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: desk
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - tickets:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U desk -d desk']
      interval: 3s
      timeout: 3s
      retries: 30
  renderer:
    build: apps/renderer
  schema:
    build: apps/api
    command: [python, -m, ticket_api.repository]
    environment: &database
      DB_HOST: db
      DB_NAME: desk
      DB_USER: desk
      DB_PASSWORD: local-development-only
    depends_on:
      db:
        condition: service_healthy
  api:
    build: apps/api
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      <<: *database
      RENDERER_URL: http://renderer:8080
    depends_on:
      schema:
        condition: service_completed_successfully
      renderer:
        condition: service_started
volumes:
  tickets:
